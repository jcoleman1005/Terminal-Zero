alice@apollo:/var/log$ man grep
NAME
    grep - print lines that match patterns

SYNOPSIS
    grep [OPTION]... PATTERN [FILE]...

DESCRIPTION
    grep searches input files for lines containing a match to the given PATTERN.
    A PATTERN is a keyword, search string, or expression you want to isolate.
    Matching lines are printed to standard output.

OPTIONS
    -i, --ignore-case
        Ignore case distinctions in patterns and input data (e.g. 'ALERT' matches 'alert').

    -v, --invert-match
        Invert the sense of matching, selecting lines that do NOT match the pattern.

    -n, --line-number
        Prefix each line of output with its 1-based line number within the file.

    -r, --recursive
        Read all files under each directory, recursively.

EXAMPLES
    grep -i 'alert' /var/log/auth.log
    grep -i 'miner' /var/log/syslog
    grep -v 'systemd' /var/log/syslog
    grep -r 'PHOENIX' /opt
